name: Tests

on:
  pull_request:
  push:
    branches: [main]

# Read-only access is enough to check out and build.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # The hook must record the tool name but never the command it ran.
      - name: Check hook plugin
        run: |
          jq empty .claude-plugin/marketplace.json plugin/.claude-plugin/plugin.json plugin/hooks/hooks.json
          events="$RUNNER_TEMP/events"
          echo '{"hook_event_name":"PreToolUse","session_id":"ci-1","tool_name":"Bash","tool_input":{"command":"echo private"},"cwd":"/tmp/Demo"}' \
            | AGENTOFFICE_EVENTS_DIR="$events" bash plugin/scripts/agentoffice-event.sh
          cat "$events/ci-1.jsonl"
          jq -e '.tool == "Bash" and .project == "Demo"' "$events/ci-1.jsonl"
          ! grep -q private "$events/ci-1.jsonl"

      - name: Run package tests
        working-directory: AgentOfficeKit
        run: swift test

      # Signing needs a developer certificate, which the runner does not have.
      - name: Build Mac app
        run: >
          xcodebuild build
          -project AgentOffice.xcodeproj
          -scheme AgentOfficeMac
          -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO

      - name: Build iPhone app
        run: >
          xcodebuild build
          -project AgentOffice.xcodeproj
          -scheme AgentOffice
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
