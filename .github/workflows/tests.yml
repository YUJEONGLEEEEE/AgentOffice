name: Tests

on:
  pull_request:
  push:
    branches: [main]

# Read-only access is enough to check out and build.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run package tests
        working-directory: AgentOfficeKit
        run: swift test

      # Signing needs a developer certificate, which the runner does not have.
      - name: Build Mac app
        run: >
          xcodebuild build
          -project AgentOffice.xcodeproj
          -scheme AgentOfficeMac
          -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO

      - name: Build iPhone app
        run: >
          xcodebuild build
          -project AgentOffice.xcodeproj
          -scheme AgentOffice
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
