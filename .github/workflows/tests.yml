name: Tests

on:
  pull_request:
  push:
    branches: [main]

# Read-only access is enough to check out and build.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # The hook must record the tool name but never the command it ran.
      - name: Check hook plugin
        run: |
          jq empty .claude-plugin/marketplace.json plugin/.claude-plugin/plugin.json plugin/hooks/hooks.json
          events="$RUNNER_TEMP/events"
          echo '{"hook_event_name":"PreToolUse","session_id":"ci-1","tool_name":"Bash","tool_input":{"command":"echo private"},"cwd":"/tmp/Demo"}' \
            | AGENTOFFICE_EVENTS_DIR="$events" bash plugin/scripts/agentoffice-event.sh
          cat "$events/ci-1.jsonl"
          jq -e '.tool == "Bash" and .project == "Demo"' "$events/ci-1.jsonl"
          ! grep -q private "$events/ci-1.jsonl"

      # The approval hook waits only while the app is open, and passes on the app's answer.
      - name: Check approval hook
        run: |
          base="$RUNNER_TEMP/agentoffice"
          mkdir -p "$base/Approvals" "$base/Events"
          request='{"session_id":"ci-2","tool_name":"Bash","tool_input":{"command":"ls"},"cwd":"/tmp/Demo"}'
          export AGENTOFFICE_DIR="$base" AGENTOFFICE_APPROVAL_WAIT=10
          # App closed: no output, no waiting.
          [ -z "$(echo "$request" | bash plugin/scripts/agentoffice-approval.sh)" ]
          # App open and answering allow.
          touch "$base/Approvals/.app-alive"
          ( for _ in $(seq 20); do
              file="$(ls "$base"/Approvals/*.request.json 2>/dev/null | head -n 1)"
              if [ -n "$file" ]; then
                id="$(jq -r .id "$file")"
                echo "{\"id\":\"$id\",\"decision\":\"allow\"}" > "$base/Approvals/$id.answer.json"
                break
              fi
              sleep 0.5
            done ) &
          output="$(echo "$request" | bash plugin/scripts/agentoffice-approval.sh)"
          wait
          echo "$output"
          echo "$output" | jq -e '.hookSpecificOutput.decision.behavior == "allow"'
          [ -z "$(ls "$base"/Approvals/*.json 2>/dev/null)" ]

      - name: Run package tests
        working-directory: AgentOfficeKit
        run: swift test

      # Signing needs a developer certificate, which the runner does not have.
      - name: Build Mac app
        run: >
          xcodebuild build
          -project AgentOffice.xcodeproj
          -scheme AgentOfficeMac
          -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO

      - name: Build iPhone app
        run: >
          xcodebuild build
          -project AgentOffice.xcodeproj
          -scheme AgentOffice
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
